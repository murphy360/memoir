# The standard ruff settings are ruff's defaults (88 columns, ruff format). Nothing to configure: add a
# [tool.ruff] section only for a reason, and write the reason in a comment beside it.
[project]
name = "memoir-api"
version = "0.1.0"
description = "Memoir's API and job worker: one package, two processes."
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.1",
  "argon2-cffi==25.1.0",
  "email-validator==2.3.0",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "sqlalchemy==2.1.6",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
# Installed in the `test` image target, where CI runs the tests and the lint.
test = ["httpx2==2.16.0", "pytest==9.2.0", "ruff==0.17.3"]

[project.scripts]
memoir-cli = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The checkout is mounted read-only in spirit: CI's runner owns it, the image's user does not.
addopts = "-p no:cacheprovider"
