# CI from murphy360/standards (templates/ci.yml), for a repository with two parts: api/ (Python) and web/
# (TypeScript). Every action outside the standards is pinned to a full commit SHA.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

# One run per ref. A pull request's superseded run is cancelled; a push to main or a tag always finishes what it
# started.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The quick checks in one job (murphy360/standards, actions/checks): standards-check, the lint, shellcheck,
  # actionlint and the secret scan. One runner and one checkout; every check runs, also after one failed, and the
  # last lines of the step say which failed.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # A self-hosted runner keeps its workspace: this takes back the files a container of the job before left
      # there, so that the checkout can replace them. On a GitHub-hosted runner it does nothing.
      - uses: murphy360/standards/actions/take-ownership@v3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the secret scan reads the commits of the change, so it needs the history
      - uses: murphy360/standards/actions/checks@v3
        with:
          format-check: true
          working-directory: api
      # The web part's lint, a second step in the same job. It runs after a failure too.
      - if: ${{ !cancelled() }}
        uses: murphy360/standards/actions/checks@v3
        with:
          checks: node-lint
          working-directory: web
          format-check: true

  deploy:
    # The production compose file (deploy/compose.yml) must stay valid.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Validate the production compose file
        run: docker compose -f deploy/compose.yml config -q
  test-api:
    uses: murphy360/standards/.github/workflows/test-docker.yml@v3
    with:
      context: api
      file: api/Dockerfile
      target: test
      command: "cd api && pytest -q"
  test-web:
    uses: murphy360/standards/.github/workflows/test-docker.yml@v3
    with:
      context: web
      file: web/Dockerfile
      target: test
      command: "cd web && npm run typecheck && npm test"
  image-api:
    needs: [checks, test-api]
    uses: murphy360/standards/.github/workflows/image.yml@v3
    with:
      image: memoir-api
      context: api
      file: api/Dockerfile
      target: api
      push: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
  image-worker:
    needs: [checks, test-api]
    uses: murphy360/standards/.github/workflows/image.yml@v3
    with:
      image: memoir-worker
      context: api
      file: api/Dockerfile
      target: worker
      push: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
  image-web:
    needs: [checks, test-web]
    uses: murphy360/standards/.github/workflows/image.yml@v3
    with:
      image: memoir-web
      context: web
      file: web/Dockerfile
      push: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write

  result:
    name: result
    if: always()
    needs: [checks, deploy, test-api, test-web, image-api, image-worker, image-web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that ran passed
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          cat needs.json
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' needs.json
