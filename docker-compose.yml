# Local development: the whole app on one machine. Open http://localhost:8080/memoir/
# Host ports default to 8080 (web) and 8010 (API); set MEMOIR_WEB_PORT or MEMOIR_API_PORT if taken.
# The service names match the production deployment in the dontpanic stack.
services:
  memoir-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: memoir
      POSTGRES_PASSWORD: memoir
      POSTGRES_DB: memoir
    volumes:
      - memoir_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoir -d memoir"]
      interval: 5s
      timeout: 3s
      retries: 20

  memoir-api:
    build: {context: ./api, target: api}
    environment: &api-env
      MEMOIR_DATABASE_URL: postgresql+psycopg://memoir:memoir@memoir-db:5432/memoir
      MEMOIR_BLOB_ROOT: /data/blobs
    volumes:
      - memoir_data:/data
    ports:
      - "${MEMOIR_API_PORT:-8010}:8000"
    depends_on:
      memoir-db: {condition: service_healthy}

  memoir-worker:
    build: {context: ./api, target: worker}
    environment: *api-env
    volumes:
      - memoir_data:/data
    depends_on:
      # The API applies the migrations on start; the worker waits until it is up.
      memoir-api: {condition: service_healthy}

  memoir-web:
    build: {context: ./web}
    ports:
      - "${MEMOIR_WEB_PORT:-8080}:8080"
    depends_on:
      - memoir-api

volumes:
  memoir_db:
  memoir_data:
